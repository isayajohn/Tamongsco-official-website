<section class="ve-newsletter-section">
  <div class="container">
    <div class="ve-newsletter-wrap">
      <div class="ve-nl-left">
        <app-site-icon name="mail" [size]="42" class="ve-icon-accent"></app-site-icon>
        <div>
          <h3>{{ title }}</h3>
          <p>{{ description }}</p>
        </div>
      </div>
      <div class="ve-nl-right">
        <form class="ve-nl-form" (submit)="preventSubmit($event)">
          <input type="email" placeholder="Enter your email address" required />
          <button type="submit">Subscribe</button>
        </form>
      </div>
    </div>
  </div>
</section>
