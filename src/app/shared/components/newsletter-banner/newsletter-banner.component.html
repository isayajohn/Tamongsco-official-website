<section class="ve-newsletter-section">
  <div class="container">
    <div class="ve-newsletter-wrap">
      <div class="ve-nl-left">
        <app-site-icon name="mail" [size]="42" class="ve-icon-accent"></app-site-icon>
        <div>
          <h3>{{ title }}</h3>
          <p>{{ description }}</p>
        </div>
      </div>
      <div class="ve-nl-right">
        <form class="ve-nl-form" (submit)="subscribe($event)">
          <input type="email" placeholder="Enter your email address" required [(ngModel)]="email" name="email" />
          <button type="submit" [disabled]="submitState === 'sending'">
            {{ submitState === 'sending' ? 'Subscribing...' : 'Subscribe' }}
          </button>
        </form>
        @if (submitState === 'sent') {
          <p class="ve-form-feedback">Subscription saved.</p>
        }
        @if (submitState === 'error') {
          <p class="ve-form-feedback">Subscription failed. Please try again.</p>
        }
      </div>
    </div>
  </div>
</section>
